name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, json, curl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare writable directories
        run: |
          mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar writable/htmlpurifier
          chmod -R 777 writable

      - name: Create .env file
        run: |
          cp env .env
          echo 'CI_ENVIRONMENT = testing' >> .env
          echo 'app.baseURL = "http://localhost/"' >> .env
          echo 'WEB_API_BASE_URL = http://localhost:8190' >> .env
          echo 'WEB_API_KEY = ci_testing_key' >> .env

      - name: PHP CS Fixer (style check)
        run: composer cs-check

      - name: PHPStan (static analysis)
        run: composer phpstan

      # The web app has no database; feature tests (SEO, page resolution) need a
      # live Domain API and are excluded here. Unit tests mock WebApiClient and
      # run in isolation.
      - name: Unit tests
        run: vendor/bin/phpunit tests/unit
